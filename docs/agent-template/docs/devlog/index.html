<article class="dev-diary dev-diary-index">
  <header>
    <h1>{{PROJECT}} Dev Diary</h1>
    <p>
      {{One sentence: what the project is, for whom.}} Newest first.
    </p>
    <p><strong><a href="{{repo URL}}">Github Repo</a></strong></p>
  </header>

  <ol reversed>
    <li>
      <p class="date">{{Month D, YYYY}}</p>
      <h2><a href="{{YYYY-MM-DD-slug}}.html">{{Title}}</a></h2>
      <p>{{One line about the entry.}}</p>
    </li>
  </ol>
</article>
