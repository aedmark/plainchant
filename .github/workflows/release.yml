name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify Tests & Docs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage frontend assets into src-tauri/dist
        run: node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('src-tauri/dist',{recursive:true});['index.html','app.html','manifest.webmanifest','sw.js'].forEach(f=>fs.copyFileSync(f,p.join('src-tauri/dist',f)));['src','fonts','icons'].forEach(d=>fs.cpSync(d,p.join('src-tauri/dist',d),{recursive:true}));"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Node & docs checks
        run: |
          npm test
          python3 tools/check_docs.py

      - name: Install Linux Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  publish:
    name: Build & Draft Release (${{ matrix.platform }})
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage frontend assets into src-tauri/dist
        run: node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('src-tauri/dist',{recursive:true});['index.html','app.html','manifest.webmanifest','sw.js'].forEach(f=>fs.copyFileSync(f,p.join('src-tauri/dist',f)));['src','fonts','icons'].forEach(d=>fs.cpSync(d,p.join('src-tauri/dist',d),{recursive:true}));"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri bundle and upload draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Plainchant ${{ github.ref_name }}"
          releaseBody: "See [`docs/CHANGELOG.md`](docs/CHANGELOG.md) for details, and verify downloads against your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
