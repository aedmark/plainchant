<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit: draw under notches (padded via env(safe-area-*)); interactive-widget: the on-screen keyboard
         resizes the layout instead of covering it (Chromium; Safari is handled by the visualViewport code below) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>SLASH Frictionless Screenwriter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Open Source Theme Variables - Easy to adapt */
            --bg-void: #0f1115;
            --text-void: #a1a1aa;
            --text-void-muted: #64748b;
            --bg-paper: #ffffff;
            --text-ink: #000000;
            --border-void: #1e293b;
            --border-paper: #e5e7eb;
            --btn-bg: #1e293b;
            --btn-text: #e2e8f0;
            --btn-hover: #334155;
            --btn-success: #15803d;

            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-screenplay: 'Courier Prime', Courier, monospace;
        }

        * {
            box-sizing: border-box;
        }

        /* Layout is desktop-first: two panes side by side. The "mobile" block near the end of this stylesheet
           swaps to one pane at a time below 1024px. Its media query is mirrored in MOBILE_QUERY in the script;
           keep both in sync. */
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            background-color: var(--bg-void);
            font-family: var(--font-ui);
            color: var(--text-void);
            overflow: hidden;
        }

        /* Touch devices and narrow windows: size the app to the visual viewport so an on-screen keyboard never
           covers the text. --app-height / --app-top come from window.visualViewport (fitToViewport); without them
           this falls back to the dynamic viewport height. Mirrored by FIT_QUERY in the script. */
        @media (pointer: coarse), (max-width: 1023px) {
            body {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: var(--app-height, 100dvh);
                transform: translateY(var(--app-top, 0px));
            }
        }

        /* Fingers need bigger targets than a mouse pointer, in every layout */
        @media (pointer: coarse) {
            .btn { min-height: 44px; }
            textarea { font-size: 16px; } /* 16px+ stops iOS Safari zooming the page when the field is focused */
        }

        /* --- THE VOID (Input) --- */
        /* min-width: 0 lets a pane shrink below its content's minimum. Without it the two panes could not fit in
           anything under ~1110px and the preview was clipped off the right edge of the screen. */
        .pane-void {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-void);
            background-color: var(--bg-void);
        }

        .header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-void);
        }

        .header h1, .header h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .header h1 { color: #f8fafc; }

        .header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.75rem;
            color: var(--text-void-muted);
        }

        /* In a narrow split (1024-1279px, panes under 640px) the tagline is squeezed to three lines beside the buttons */
        @media (max-width: 1279px) {
            .pane-void .header p { display: none; }
        }

        .btn {
            padding: 0.5rem 1rem;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-family: inherit;
        }

        .btn:hover { background-color: var(--btn-hover); }
        .btn.success { background-color: var(--btn-success); color: white; }

        textarea {
            flex: 1;
            width: 100%;
            padding: 1.5rem;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: var(--text-void);
            font-family: monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        /* --- THE CANVAS (Output) --- */
        .pane-canvas {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-paper);
            position: relative;
        }

        .pane-canvas .header {
            background-color: white;
            border-bottom: 1px solid var(--border-paper);
            z-index: 20;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .pane-canvas .header h2 { color: var(--text-ink); }

        .font-badge {
            font-family: monospace;
            font-size: 0.75rem;
            background: #f3f4f6;
            color: #6b7280;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid #e5e7eb;
        }

        /* The scroll area is also a size container: the @container rules below re-proportion the screenplay by the
           width of *this column*, not by the device, so phones, portrait tablets and a narrow split all work. */
        #render-target {
            flex: 1;
            overflow-y: auto;
            padding: 3rem clamp(1rem, 2.5vw, 4rem);
            color: var(--text-ink);
            background-color: var(--bg-paper);
            container: sheet / inline-size;
        }

        /* Screenplay Formatting (CSS Implementation of Fountain Rules).
           Indents are variables so a narrow column can re-proportion them (see @container below). */
        .screenplay-font {
            --ind-char: 22ch;
            --ind-paren: 16ch;
            --w-paren: 15ch;
            --ind-dialogue: 10ch;
            --w-dialogue: 35ch;
            --ind-transition: 40ch;
            --transition-align: left;

            font-family: var(--font-screenplay);
            font-size: 12pt; /* Standard 12pt Courier */
            line-height: 1.1;
            /* A fixed column: as wide as the pane allows up to 6 inches (60ch at 10-pitch), centred as a page.
               The explicit width keeps it from shrinking to fit its contents. */
            width: 100%;
            max-width: 60ch;
            margin: 0 auto;
            text-align: left; /* Enforce rigid left alignment */
        }

        /* Spacing comes from margins only: the parser emits no spacer elements. */
        .script-scene-heading { text-transform: uppercase; font-weight: 700; margin: 1.5rem 0 1rem; }
        .script-scene-num { float: right; font-weight: 400; color: #6b7280; }
        .script-action { margin: 0 0 1rem; width: 100%; white-space: pre-wrap; }

        .script-dialogue-block { margin: 0 0 1rem; }
        .script-character { text-transform: uppercase; margin-left: var(--ind-char); }
        .script-parenthetical { margin-left: var(--ind-paren); max-width: var(--w-paren); }
        .script-dialogue { margin-left: var(--ind-dialogue); max-width: var(--w-dialogue); }

        /* Dual dialogue: two blocks side by side, indents scaled down to fit half width */
        .script-dual {
            --ind-char: 8ch; --ind-paren: 4ch; --w-paren: none; --ind-dialogue: 0; --w-dialogue: none;
            display: flex; gap: 2ch; margin-bottom: 1rem;
        }
        .script-dual .script-dialogue-block { flex: 1; min-width: 0; margin: 0; }

        /* The nowrap ensures CUT TO: does not collapse under responsive pressure (mobile lets it wrap) */
        .script-transition {
            text-transform: uppercase;
            margin: 0 0 1rem var(--ind-transition);
            text-align: var(--transition-align);
            white-space: nowrap;
        }
        /* A true page is 60ch of text (6 inches at 10-pitch). When the column is narrower than that, re-proportion the
           indents as percentages of the column instead of fixed character counts: nothing overflows, nothing forces
           the pane wider, and transitions wrap. 36rem is 60ch at 12pt Courier. Below ~26rem (phones) the type also
           steps down so a line still holds a useful number of characters. */
        @container sheet (max-width: 36rem) {
            .screenplay-font {
                --ind-char: 30%;
                --ind-paren: 20%;
                --w-paren: 60%;
                --ind-dialogue: 8%;
                --w-dialogue: 84%;
                --ind-transition: 0;
                --transition-align: right;
            }
            .script-transition { white-space: normal; }
            /* Two half-width columns would be unreadably narrow: stack dual dialogue instead */
            .script-dual {
                flex-direction: column;
                gap: 1rem;
                --ind-char: 30%; --ind-paren: 20%; --w-paren: 60%; --ind-dialogue: 8%; --w-dialogue: 84%;
            }
        }
        @container sheet (max-width: 26rem) {
            .screenplay-font { font-size: 14px; line-height: 1.25; }
        }

        .script-centered { text-align: center; margin: 0 0 1rem; }
        .script-lyrics { font-style: italic; margin: 0 0 1rem; }
        .script-page-break { border: 0; border-top: 1px dashed #cbd5e1; margin: 1.5rem 0; }
        .script-note {
            font-family: var(--font-ui); font-size: 0.75em; background: #fef9c3; color: #713f12;
            padding: 0 0.3em; border-radius: 0.2rem;
        }

        /* Outline aids: visible while writing, not part of the screenplay itself */
        .script-section {
            font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: #94a3b8; border-bottom: 1px solid var(--border-paper);
            margin: 1.5rem 0 0.75rem; padding-bottom: 0.25rem;
        }
        .script-synopsis { font-family: var(--font-ui); font-size: 0.75rem; font-style: italic; color: #6b7280; margin: 0 0 1rem; }

        .script-title-page { text-align: center; padding: 4rem 0 3rem; margin-bottom: 2rem; border-bottom: 1px dashed #cbd5e1; }
        .script-title-page .tp-title { text-transform: uppercase; font-weight: 700; margin-bottom: 2rem; }
        .script-title-page .tp-author { margin-bottom: 2rem; }
        .script-title-page .tp-meta { margin-top: 1rem; font-size: 10pt; }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        .pane-canvas ::-webkit-scrollbar-thumb { background: #cbd5e1; }
        .pane-canvas ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- MODALS & UI --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 17, 21, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-void);
            border: 1px solid var(--border-void);
            border-radius: 0.5rem;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-void);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1rem; color: #f8fafc; }
        .modal-close { background: transparent; color: var(--text-void-muted); border: none; cursor: pointer; font-size: 1.25rem; }
        .modal-close:hover { color: #f8fafc; }
        .modal-body {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }
        .script-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-void);
            cursor: pointer;
            transition: background 0.2s;
        }
        .script-item:hover { background: var(--border-void); }
        .script-item:last-child { border-bottom: none; }
        .script-title { font-weight: 600; color: #f8fafc; margin-bottom: 0.25rem; }
        .script-preview { font-size: 0.75rem; color: var(--text-void-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .button-group { display: flex; gap: 0.5rem; }

        /* --- MOBILE BAR (shown below 1024px; see the mobile block below) --- */
        .mobile-bar { display: none; }

        /* --- ONE PANE AT A TIME, switched from the top bar (P2-05, D-009) ---
           Below 1024px two panes are too cramped to be useful (each would get under 512px), so phones AND portrait
           tablets show one pane with a Write | Preview switch. Landscape tablets (1024px+) keep the split.
           Landscape phones count too: a keyboard leaves them too little height for two panes.
           Mirrored by MOBILE_QUERY in the script. The screenplay's own responsiveness is not here: it follows the
           width of the preview column via @container above. */
        @media (max-width: 1023px), (pointer: coarse) and (max-height: 500px) {
            body {
                --bar-h: 52px;
                flex-direction: column;
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            }
            body.kb-open { padding-bottom: 0; }

            .mobile-bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex: 0 0 var(--bar-h);
                height: var(--bar-h);
                padding: 0 0.75rem;
                border-bottom: 1px solid var(--border-void);
                background-color: var(--bg-void);
            }
            .seg {
                flex: 1;
                display: flex;
                gap: 3px;
                padding: 3px;
                background-color: var(--btn-bg);
                border-radius: 0.5rem;
            }
            .seg button {
                flex: 1;
                min-height: 40px;
                border: none;
                border-radius: 0.375rem;
                background: transparent;
                color: var(--text-void-muted);
                font: 600 0.9rem var(--font-ui);
                cursor: pointer;
            }
            .seg button[aria-pressed="true"] { background-color: var(--btn-hover); color: #f8fafc; }
            .menu-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }

            /* Only the selected pane is shown, and it fills whatever height the viewport has left */
            .pane-void, .pane-canvas { flex: 1; height: auto; min-height: 0; border: 0; }
            .pane-canvas { display: none; }
            body[data-view="preview"] .pane-canvas { display: flex; }
            /* While previewing, the Void's box goes away but its menu (a fixed-position child) must stay reachable */
            body[data-view="preview"] .pane-void { display: contents; }
            body[data-view="preview"] .pane-void textarea { display: none; }

            .pane-canvas > .header { display: none; }

            /* The Void's header disappears; its action buttons become a drop-down menu under the top bar */
            .pane-void > .header { display: contents; }
            .pane-void > .header > div:first-child { display: none; }
            .pane-void > .header .button-group {
                display: none;
                position: fixed;
                z-index: 40;
                top: calc(var(--bar-h) + env(safe-area-inset-top));
                right: calc(0.75rem + env(safe-area-inset-right));
                flex-direction: column;
                min-width: 11rem;
                padding: 0.25rem;
                background-color: var(--bg-void);
                border: 1px solid var(--border-void);
                border-radius: 0.5rem;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            }
            body.menu-open .pane-void > .header .button-group { display: flex; }
            .button-group .btn { min-height: 44px; text-align: left; }

            textarea { padding: 1rem; font-size: 16px; }

            #render-target { padding: 1rem; overscroll-behavior: contain; }

            .modal-close { min-width: 44px; min-height: 44px; }
        }

        /* --- TABLET TIER of the one-pane layout (700px and up) ---
           There is room for the actions in the bar itself, so no menu. The editor's text keeps a readable line
           length instead of stretching across the screen, and the preview is a full-size page. */
        @media (min-width: 700px) and (max-width: 1023px), (min-width: 700px) and (pointer: coarse) and (max-height: 500px) {
            .menu-btn { display: none; }
            .seg { flex: 0 1 16rem; }
            .mobile-bar { padding: 0 1rem; }
            .pane-void > .header .button-group {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                top: env(safe-area-inset-top);
                right: calc(1rem + env(safe-area-inset-right));
                height: var(--bar-h);
                min-width: 0;
                padding: 0;
                background: none;
                border: 0;
                box-shadow: none;
            }
            .button-group .btn { min-height: 40px; padding: 0 0.75rem; text-align: center; }

            /* Full-width box (the whole screen stays tappable) with the text held to ~44rem in the middle */
            textarea { padding-inline: max(1.5rem, calc((100vw - 44rem) / 2)); padding-block: 1.5rem; }
            #render-target { padding: 2rem; }
        }
    </style>
</head>
<body data-view="write">

<!-- Mobile bar: switches between writing and previewing on phones and portrait tablets (under 1024px wide).
     Hidden on wider screens, where both panes show. -->
<div class="mobile-bar">
    <div class="seg" role="group" aria-label="View">
        <button id="tabWrite" type="button" aria-pressed="true">Write</button>
        <button id="tabPreview" type="button" aria-pressed="false">Preview</button>
    </div>
    <button id="menuBtn" type="button" class="btn menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="10" r="1.75"/><circle cx="10" cy="10" r="1.75"/><circle cx="16" cy="10" r="1.75"/>
        </svg>
    </button>
</div>

<!-- The Void (Input) -->
<div class="pane-void">
    <div class="header">
        <div>
            <h1>The Void</h1>
            <p>Just type. We handle the structure.</p>
        </div>
        <div class="button-group">
            <button id="newBtn" class="btn">New</button>
            <button id="libraryBtn" class="btn">Library</button>
            <button id="saveBtn" class="btn">Save</button>
            <button id="exportBtn" class="btn">Export</button>
            <button id="copyBtn" class="btn">Copy</button>
        </div>
    </div>
    <textarea id="editor" placeholder="FADE IN:&#10;&#10;INT. COFFEE SHOP - DAY&#10;&#10;The cafe is entirely empty.&#10;&#10;JOHN&#10;(nervous)&#10;I just wanted a program that let me type without thinking.&#10;&#10;THE ARTISAN&#10;It is done.&#10;&#10;CUT TO:&#10;&#10;EXT. THE VOID - CONTINUOUS"></textarea>
</div>

<!-- The Canvas (Output) -->
<div class="pane-canvas">
    <div class="header">
        <div>
            <h2>The Canvas</h2>
            <p>Live structural rendering.</p>
        </div>
        <span class="font-badge">Courier Prime</span>
    </div>
    <!-- #render-target is the full-width scroll area; #page is the fixed-width screenplay column inside it.
         They must stay separate elements: as one flex item with auto margins the column shrank to its widest
         line and floated to the middle whenever no line filled the width. -->
    <div id="render-target">
        <div id="page" class="screenplay-font">
            <!-- Rendered script appears here -->
        </div>
    </div>
</div>

<!-- Library Modal -->
<div id="library-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Your Scripts</h2>
            <button id="modal-close" class="modal-close">&times;</button>
        </div>
        <div id="library-list" class="modal-body">
            <!-- Scripts injected here -->
        </div>
    </div>
</div>

<script src="src/fountain.js"></script>
<script>
    const editor = document.getElementById('editor');
    const renderTarget = document.getElementById('render-target'); // scroll container
    const page = document.getElementById('page');                  // where the screenplay is rendered
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const exportBtn = document.getElementById('exportBtn');
    const libraryBtn = document.getElementById('libraryBtn');
    const newBtn = document.getElementById('newBtn');
    const libraryModal = document.getElementById('library-modal');
    const modalClose = document.getElementById('modal-close');
    const libraryList = document.getElementById('library-list');

    const SCRIPTS_KEY = 'frictionless_scripts';   // legacy prefix kept on purpose (D-005)
    const CURRENT_KEY = 'frictionless_current';   // id of the script that was open last

    // crypto.randomUUID is unavailable on plain-http origins (e.g. testing from a phone on the LAN)
    function newId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    let currentScriptId = newId();
    let autoSaveTimer;

    function render() {
        page.innerHTML = Fountain.toHTML(Fountain.parse(editor.value || editor.getAttribute('placeholder')));
    }

    // --- Mobile: one pane at a time, drop-down menu, keyboard-safe sizing (P2-05) ---
    // Both must match the media queries in the stylesheet (the "one pane at a time" block, and the fixed-body rule).
    const MOBILE_QUERY = '(max-width: 1023px), (pointer: coarse) and (max-height: 500px)';
    const FIT_QUERY = '(pointer: coarse), (max-width: 1023px)';
    const mobileMQ = window.matchMedia(MOBILE_QUERY);
    const fitMQ = window.matchMedia(FIT_QUERY);
    const tabWrite = document.getElementById('tabWrite');
    const tabPreview = document.getElementById('tabPreview');
    const menuBtn = document.getElementById('menuBtn');
    const buttonGroup = document.querySelector('.button-group');

    function setView(view) {
        document.body.dataset.view = view;
        tabWrite.setAttribute('aria-pressed', String(view === 'write'));
        tabPreview.setAttribute('aria-pressed', String(view === 'preview'));
        setMenu(false);
        if (view === 'preview') {
            editor.blur(); // drop the keyboard so the preview gets the full height
            scrollPreviewToCaret();
        } else if (mobileMQ.matches) {
            editor.focus({ preventScroll: true });
        }
    }

    // Show the part of the script the writer was just typing, not the top of the page.
    // Uses the data-line anchors the renderer puts on every block.
    function scrollPreviewToCaret() {
        const caretLine = editor.value.slice(0, editor.selectionStart).split('\n').length - 1;
        let target = null;
        for (const el of renderTarget.querySelectorAll('[data-line]')) {
            if (Number(el.dataset.line) > caretLine) break;
            target = el;
        }
        if (!target) { renderTarget.scrollTop = 0; return; }
        const top = target.getBoundingClientRect().top - renderTarget.getBoundingClientRect().top + renderTarget.scrollTop;
        renderTarget.scrollTop = Math.max(0, top - renderTarget.clientHeight / 3);
    }

    function setMenu(open) {
        document.body.classList.toggle('menu-open', open);
        menuBtn.setAttribute('aria-expanded', String(open));
    }

    // Size the app to the *visual* viewport so the on-screen keyboard never hides the text being typed.
    // Chromium already does this via interactive-widget=resizes-content; Safari needs it done by hand.
    // Takes the viewport as an argument so tests can pass a fake one.
    function fitToViewport(vv = window.visualViewport) {
        const rootStyle = document.documentElement.style;
        if (!vv || !fitMQ.matches) {
            rootStyle.removeProperty('--app-height');
            rootStyle.removeProperty('--app-top');
            document.body.classList.remove('kb-open');
            return;
        }
        rootStyle.setProperty('--app-height', vv.height + 'px');
        rootStyle.setProperty('--app-top', vv.offsetTop + 'px');
        // Keyboard up: the home-indicator inset is hidden behind it, so don't reserve space for it
        document.body.classList.toggle('kb-open', vv.height < window.innerHeight - 120);
    }

    // --- Local Storage Persistence ---
    function getScripts() {
        try {
            const data = localStorage.getItem(SCRIPTS_KEY);
            return data ? JSON.parse(data) : {};
        } catch (e) {
            console.error("Failed to parse local storage", e);
            return {};
        }
    }

    function rememberCurrent() {
        try { localStorage.setItem(CURRENT_KEY, currentScriptId); } catch (e) { /* storage unavailable */ }
    }

    // Reopen whatever was open last. With no pointer at all (first run after upgrading from the prototype)
    // fall back to the most recently saved script. A pointer to a script that was never saved means the
    // writer had just hit New, so start blank.
    function restoreLastScript() {
        let pointer = null;
        try { pointer = localStorage.getItem(CURRENT_KEY); } catch (e) { /* storage unavailable */ }
        const scripts = getScripts();

        let script = pointer ? scripts[pointer] : null;
        if (!pointer) {
            script = Object.values(scripts).sort((a, b) => b.updatedAt - a.updatedAt)[0] || null;
        }

        if (script) {
            currentScriptId = script.id;
            editor.value = script.content;
        } else if (pointer) {
            currentScriptId = pointer;
        }
        rememberCurrent();
    }

    function startNewScript() {
        flushSave();
        currentScriptId = newId();
        editor.value = '';
        rememberCurrent();
        render();
        // In one-pane mode the writer may be looking at the preview: bring them back to the blank page
        if (mobileMQ.matches) setView('write');
        else editor.focus();
    }

    // Save immediately, skipping the autosave delay. Used when the page is about to go away.
    function flushSave() {
        clearTimeout(autoSaveTimer);
        if (editor.value.trim()) saveScript(true);
    }

    function saveScript(isAuto = false) {
        const rawText = editor.value;
        if (!rawText.trim()) return;

        const title = Fountain.extractTitle(rawText);

        const originalText = saveBtn.innerText;
        if (!isAuto) {
            saveBtn.innerText = "Saving...";
        }

        try {
            const scripts = getScripts();
            scripts[currentScriptId] = {
                id: currentScriptId,
                title: title,
                content: rawText,
                updatedAt: Date.now()
            };
            localStorage.setItem(SCRIPTS_KEY, JSON.stringify(scripts));
            rememberCurrent();

            if (!isAuto) {
                saveBtn.innerText = "Saved!";
                saveBtn.classList.add('success');
            }
        } catch (e) {
            console.error("Save error:", e);
            if (!isAuto) saveBtn.innerText = "Error";
        }

        if (!isAuto) {
            setTimeout(() => {
                saveBtn.innerText = originalText;
                saveBtn.classList.remove('success');
            }, 2000);
        }
    }

    function loadLibrary() {
        libraryList.innerHTML = '';

        try {
            const scriptsObj = getScripts();
            const scripts = Object.values(scriptsObj);

            if (scripts.length === 0) {
                libraryList.innerHTML = '<div class="script-item"><div class="script-preview">No saved scripts found.</div></div>';
                return;
            }

            // Sort newest first
            scripts.sort((a, b) => b.updatedAt - a.updatedAt);

            scripts.forEach(script => {
                const item = document.createElement('div');
                item.className = 'script-item';

                const safeTitle = Fountain.escapeHTML(script.title);
                const safePreview = Fountain.escapeHTML(script.content.substring(0, 60));

                item.innerHTML = `
                    <div class="script-title">${safeTitle}</div>
                    <div class="script-preview">${safePreview}...</div>
                `;
                item.addEventListener('click', () => {
                    flushSave();
                    currentScriptId = script.id;
                    editor.value = script.content;
                    rememberCurrent();
                    render();
                    libraryModal.classList.remove('active');
                });
                libraryList.appendChild(item);
            });
        } catch (e) {
            console.error("Load error:", e);
            libraryList.innerHTML = '<div class="script-item"><div class="script-preview">Error loading scripts.</div></div>';
        }
    }

    // --- Event Listeners ---
    saveBtn.addEventListener('click', () => saveScript(false));
    newBtn.addEventListener('click', startNewScript);

    tabWrite.addEventListener('click', () => setView('write'));
    tabPreview.addEventListener('click', () => setView('preview'));

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // otherwise the outside-click handler below closes the menu straight away
        setMenu(!document.body.classList.contains('menu-open'));
    });
    buttonGroup.addEventListener('click', () => setMenu(false)); // choosing an action closes the menu
    document.addEventListener('click', (e) => {
        if (document.body.classList.contains('menu-open') && !e.target.closest('.button-group')) setMenu(false);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

    mobileMQ.addEventListener('change', () => { setMenu(false); fitToViewport(); });
    fitMQ.addEventListener('change', () => fitToViewport());
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', () => fitToViewport());
        visualViewport.addEventListener('scroll', () => fitToViewport());
    }

    // The last 2 s of typing would otherwise be lost if the tab closes or the phone backgrounds the page
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushSave();
    });
    window.addEventListener('pagehide', flushSave);

    libraryBtn.addEventListener('click', () => {
        libraryModal.classList.add('active');
        loadLibrary();
    });

    modalClose.addEventListener('click', () => {
        libraryModal.classList.remove('active');
    });

    libraryModal.addEventListener('click', (e) => {
        if (e.target === libraryModal) libraryModal.classList.remove('active');
    });

    // Generate physical text file export dynamically
    exportBtn.addEventListener('click', () => {
        const rawText = editor.value;
        if (!rawText.trim()) return;

        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const title = lines.length > 0 ? lines[0].substring(0, 40).replace(/[^a-z0-9]/gi, '_').toLowerCase() : "untitled_script";

        const blob = new Blob([rawText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.txt`;

        document.body.appendChild(a);
        a.click();

        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // Rendering is handled by src/fountain.js (see D-003); render() is defined above.
    editor.addEventListener('input', () => {
        render();

        // Quietly auto-save after 2 seconds of typing inactivity
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
            if (editor.value.trim()) {
                saveScript(true);
            }
        }, 2000);
    });

    // Reopen the last script (or show the placeholder example on a blank editor)
    window.addEventListener('DOMContentLoaded', () => {
        restoreLastScript();
        render();
        fitToViewport();
    });

    // Copy functionality
    // The async Clipboard API works even while the textarea is hidden (previewing on a phone) but needs a secure
    // context; fall back to selecting the textarea and execCommand elsewhere (e.g. plain http on a LAN).
    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (e) {
            editor.select();
            return document.execCommand('copy');
        }
    }

    copyBtn.addEventListener('click', async () => {
        const ok = await copyText(editor.value);

        // Brief UI feedback
        const originalText = copyBtn.innerText;
        copyBtn.innerText = ok ? "Copied!" : "Copy failed";
        copyBtn.classList.toggle('success', ok);

        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.classList.remove('success');
        }, 2000);
    });

    // Sync scrolling (Optional but helpful for large documents)
    // A pane that does not overflow has a scroll range of 0; dividing by it produced NaN
    editor.addEventListener('scroll', () => {
        const editorRange = editor.scrollHeight - editor.clientHeight;
        const renderRange = renderTarget.scrollHeight - renderTarget.clientHeight;
        if (editorRange <= 0 || renderRange <= 0) return;
        renderTarget.scrollTop = (editor.scrollTop / editorRange) * renderRange;
    });
</script>
</body>
</html>
